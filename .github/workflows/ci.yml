name: ci

# Tiers 0 and 1 (docs/design/04-testing.md §4), on every commit of a pull request.
# Tier 0 is the `lint`, `test`, `install-shape`, `release-build` and `docs` jobs:
# under a minute, no containers. Tier 1 is the `tier1` job: Oracle Free, Vault,
# PostgreSQL, Supabase and Yopass from test/compose.yaml. The jobs run in
# parallel, so a typo still reports from tier 0 in a minute while tier 1 waits on
# the Oracle healthcheck.
#
# Tier 1 is a job here, not a workflow of its own, so that `ci ok` waits for it
# and the `main` ruleset's one required check covers it (#1120). In a separate
# workflow it was not a merge gate: `ci ok` could pass while it failed.
#
# docs/workflow.md says "main is always green" as a binding rule, and this is what
# checks it -- on pull requests, which is not a weaker place to check it than
# `main` is. A `pull_request` run checks out `refs/pull/N/merge`, the head already
# merged into the base, so it tests the tree a squash merge is about to produce
# rather than the branch in isolation. A run on the push to `main` would test an
# identical tree a second time.
#
# What it gives up: a PR whose last run predates something else landing on `main`
# merges on a stale answer. That needs two pull requests open at once, and the
# `main` ruleset requires `ci ok` without requiring branches to be up to date
# (see workflow.md). One PR at a time is the working pattern; `workflow_dispatch`
# is the escape hatch when `main` needs checking by hand.

on:
  pull_request:
  workflow_dispatch:

# Read-only. This workflow reports; it never writes to the repository.
# `pull-requests: read` is for the `changes` job below, which asks the API which
# files a pull request touches.
permissions:
  contents: read
  pull-requests: read

# Safe to cancel, unlike release-please, where a cancelled run can leave a stale
# release PR. Here a superseded run is only telling us about a commit that is no
# longer the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash on Windows too, so a step cannot pass on one OS and fail on the other
    # for a quoting reason that has nothing to do with the code (P4).
    shell: bash

jobs:
  # Prose-only pull requests skip the lanes below. **This is a job rather than a
  # `paths-ignore` on the trigger, and that difference is the whole point.**
  #
  # `ci ok` -- the last job in this file -- is the status check the `main`
  # ruleset requires (`workflow.md`), and `ci ok` needs every job below. The two
  # mechanisms look alike and do opposite things under protection:
  #
  # * a workflow skipped by `paths-ignore` never starts, so its check contexts
  #   are never created and a required one stays **pending forever** -- every
  #   prose-only pull request becomes unmergeable, three years after the line
  #   that caused it was written;
  # * a job skipped by an `if:` inside a workflow that *did* start reports a
  #   conclusion of `skipped`, which branch protection accepts, and which
  #   allocates no runner and bills nothing.
  #
  # So the saving survives and the trap does not. Decided in #375, which measured
  # the alternative: dropping the filter from this workflow outright costs about
  # twenty billed minutes for a prose-only pull request -- ten jobs, each rounded
  # up to a whole minute, with the Windows cell billing at 2x. This job costs one.
  #
  # A skipped required check *passes*, so a broken filter here could wave a red
  # pull request through. `set -euo pipefail` is the first half of the answer
  # and `ci ok` is the other half -- see the comment on it.
  #
  # **The prose list is a measured allowlist, not "docs".** The suite reads
  # `docs/design/00-principles.md`, `docs/design/01-configuration.md`, every
  # `docs/schemas/*.json`, every `examples/*.yaml` and `sql/oracle/00_install.sql`:
  # the config reference's YAML examples must parse, the schemas are validated as
  # artefacts (invariant 12), and `tests/test_examples.py` runs `config validate`
  # against every example. A blanket `docs/**` would silently stop testing the
  # first three, and `examples/**` would switch the fourth off while leaving its
  # test green on whatever was last committed. So only files nothing opens are
  # listed. `test/paths_ignore_probe.py` measures it, and says how to run it.
  # It deselects the modules the `docs` job runs (#458), so what it reports is a
  # file nothing would check on a prose-only pull request.
  # `tests/test_workflow_prose_list.py` keeps `examples/` and `sql/` out of it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # No checkout: the API answers this without a clone, and a clone is most of
      # what the job would otherwise cost.
      - name: does this pull request touch anything but prose?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "$PR" ]; then
            echo "not a pull request -- running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prose=(
            # prose-list-start
            'docs/local-testing.md'
            'docs/maintainer-environments.md'
            'docs/workflow.md'
            'docs/README.md'
            'docs/getting-started.md'
            'docs/security-model.md'
            'docs/decisions/**'
            'docs/use-cases/**'
            'docs/scenarios/**'
            'docs/assets/**'
            'docs/design/02-oracle-privileges.md'
            'docs/design/03-json-output.md'
            'docs/design/04-testing.md'
            'README.md'
            'CLAUDE.md'
            'CHANGELOG.md'
            'CONTRIBUTING.md'
            'SECURITY.md'
            'CODE_OF_CONDUCT.md'
            'LICENSE'
            '.gitignore'
            # prose-list-end
          )

          # Every wildcard in that list is `**`, and bash's `*` already crosses
          # `/`, so each pattern is used as written. A single `*` would be wrong
          # here -- it does not mean the same thing to bash as it does to
          # GitHub -- and there is deliberately none in the list.
          is_prose() {
            local file=$1 pattern
            for pattern in "${prose[@]}"; do
              # shellcheck disable=SC2053
              if [[ $file == $pattern ]]; then
                return 0
              fi
            done
            return 1
          }

          code=false
          while IFS= read -r file; do
            if is_prose "$file"; then
              echo "  prose  $file"
            else
              echo "  code   $file"
              code=true
            fi
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "::notice::something other than prose changed -- running every lane"
          else
            echo "::notice::prose only -- lint, test, install shape and tier 1 will report skipped"
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      # Formatting and lint are deterministic: same answer on every OS and every
      # interpreter, so running them once is running them enough. Six identical
      # red crosses for one stray blank line is noise, not coverage.
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    # Python 3.11 is in the matrix because requires-python allows it and the code
    # already uses StrEnum and datetime.UTC, both 3.11-only. Windows is in it
    # because the cp1252 stream-encoding bug (#12, fixed in #14) was Windows-only
    # and invisible on Linux, and P4 requires identical behaviour on both.
    #
    # **Windows runs one interpreter, not every version**, and the axis it is here
    # for is kept whole. Windows minutes bill at 2x and round up per job. When the
    # matrix had three versions, their three Windows cells were two thirds of this
    # workflow's cost. What they were buying:
    #
    # * the platform axis -- one cell covers it, and that is the axis the
    #   cp1252 bug, `config/permissions.py`'s DACL walk and the wallet permission
    #   check all live on;
    # * mypy's `sys.platform` narrowing, which is why mypy runs on the whole
    #   matrix rather than once (workflow.md) -- also per-platform, and pinned to
    #   `python_version = "3.11"` in pyproject.toml, so mypy gives the identical
    #   answer whichever interpreter starts it;
    # * the interpreter axis -- untouched, because Linux still runs every version
    #   and nothing in `src/` or `tests/` branches on `sys.version_info`.
    #
    # 3.13 rather than the floor: Linux 3.11 already fails first on anything
    # version-specific, so the Windows cell is better spent on what people install.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.shuffle && ', shuffled' || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One failing cell must not hide the others: knowing whether a break is
      # Windows-only or 3.11-only is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # `shuffle` is an axis of its own so that the include below adds a cell.
        # An include that only matched `os` and `python-version` would merge into
        # the existing Linux 3.13 cell, and no cell would run 3.13 in a fixed order.
        shuffle: [false]
        include:
          - os: windows-latest
            python-version: "3.13"
          # The one shuffled cell (#510, `04-testing.md` §3). Every other cell
          # runs in the fixed order `addopts` sets.
          - os: ubuntu-latest
            python-version: "3.13"
            shuffle: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[all]`, not `[dev]` alone: `04-testing.md` §3 makes `sopuli[all]` the
      # shape the full suite runs under, and "the only one where a full suite is
      # meaningful". A test whose subject is a vendor client has nothing to
      # assert without that client, and skipping it here would mean the cells
      # that look like full coverage are quietly not. The lean shapes have their
      # own job below, which is the whole reason this one can be fat.
      - run: pip install -e ".[dev,all]"

      # mypy lives here rather than in the lint job because it is *not*
      # OS-independent: it narrows `sys.platform` to the platform it runs on, so
      # the Windows branch of sopuli/output/color.py is dead code to a Linux run
      # and never gets checked there. Running it on both is what covers
      # platform-conditional code.
      - name: mypy
        run: mypy

      - name: pytest
        if: ${{ !matrix.shuffle }}
        run: pytest

      # The seed is the run's id, so re-running a red job runs the same order
      # again instead of hiding the failure behind a new one. `-q` hides
      # pytest-randomly's own seed line, so the step prints it.
      - name: pytest, shuffled
        if: ${{ matrix.shuffle }}
        env:
          SEED: ${{ github.run_id }}
        run: |
          echo "shuffled with seed $SEED; reproduce with: pytest -p randomly --randomly-seed=$SEED"
          pytest -p randomly --randomly-seed="$SEED"

      # "main is always green -- tests pass, *and the tool works*". A broken
      # console-script entry point or a missing package in the wheel passes every
      # unit test, because they import sopuli rather than run it.
      #
      # The config file is written here rather than committed to the repository:
      # a `sopuli.yaml` in the checkout is step 3 of P1's search path, so it
      # would be found by anyone running the tool in a clone and would make the
      # discovery tests depend on it existing.
      #
      # Not $RUNNER_TEMP. P4 refuses a config file anyone else can reach, and on
      # a Windows runner $RUNNER_TEMP carries an inherited grant to
      # BUILTIN\Users -- exactly the tampering risk the rule is about, since
      # anyone who can write the file can repoint `secret_template` at a path
      # they control. $TEMP is the user's own temp directory, which is where
      # pytest's tmp_path already lives, so its ACL is the one the Windows test
      # cells depend on today. chmod covers the other platform, where the
      # runner's umask leaves the file group-readable.
      - name: the installed binary runs
        run: |
          sopuli --version
          config="${TEMP:-/tmp}/sopuli-ci.yaml"
          printf 'version: 1\n' > "$config"
          chmod 600 "$config"
          sopuli config show --config "$config" > /dev/null
          sopuli config show --config "$config" --output json > /dev/null
          sopuli config validate --config "$config" > /dev/null
          sopuli config validate --config "$config" --output json > /dev/null

  # ADR-006's three rules, checked against real installs rather than against a
  # blocked import. `tests/store/test_install_shape.py` holds rule 3 inside the
  # suite, wherever the suite happens to run; this holds the packaging itself,
  # which is the half a test cannot see: an extra that silently depends on a
  # sibling, or a `sopuli[all]` that does not resolve, is a `pip` fact and not a
  # Python one.
  #
  # `04-testing.md` §3 makes install shape a dimension of the matrix. It is tier
  # 0 and needs no container; one interpreter and one OS is enough, because
  # nothing here is platform-conditional -- `pywin32` is in base under a marker
  # and is not an extra.
  # The release job's own steps, on every pull request that touches code
  # (#868). That job runs only once release-please has cut the tag, so a
  # broken pin in .github/requirements/release.txt, or a pinned hatchling that
  # cannot build pyproject.toml, would otherwise show first as a release with
  # nothing on PyPI. Keep these steps the same as release-please.yml's `build`.
  release-build:
    name: release build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/release.txt
      - run: python -m pip check
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*

  install-shape:
    name: install shape (${{ matrix.shape }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # base first, because it is the cell that can actually fail: the others
        # prove an extra resolves, and base proves the boundary held.
        shape: ["", "[oracle]", "[postgres]", "[hashicorp]", "[oci]", "[notify]", "[yopass]", "[all]"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install ".${{ matrix.shape }}"

      # The offline commands are the promise ADR-006 makes about what a base
      # install still does: a config naming a backend validates with that
      # backend uninstalled, because declaring a store is config and reaching
      # one is not (01-configuration.md §3a).
      - name: the offline commands work
        run: |
          config="${TEMP:-/tmp}/sopuli-shape.yaml"
          printf 'version: 1\nvaults:\n  vault-prod:\n    type: hashicorp\n    mount: secret\n' > "$config"
          chmod 600 "$config"
          sopuli config validate --config "$config"
          sopuli config show --config "$config" --output json > /dev/null

      # Rule 3, as ADR-006 states it: in a *base* install none of the clients
      # the backends reach with is importable. Asserted only in that cell --
      # everywhere else the clients are installed on purpose, and asserting
      # their absence would be asserting the extra did not work.
      - name: base opens no sockets
        if: matrix.shape == ''
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          present = [name for name in ("httpx", "oci", "oracledb", "psycopg", "pysequoia")
                     if importlib.util.find_spec(name) is not None]
          if present:
              sys.exit(f"base install pulled in a backend client: {', '.join(present)}")
          print("base carries no backend client")
          PY

  # Tier 1 (04-testing.md §4): the UC-1 happy path and the store's real-backend
  # tests, against the containers in test/compose.yaml.
  #
  # **Only freely pullable images** (§1). `gvenzl/oracle-free`, `hashicorp/vault`,
  # `postgres`, `supabase/postgres` and Yopass are pullable by anyone including a
  # fork, and Instant Client is a free download with no account. Nothing here
  # needs a licence, a build from Oracle binaries, or a tenancy: those are tier 3,
  # and they are the maintainer's machine rather than this file.
  #
  # Skipped for prose, like the tier-0 lanes, and in `ci ok`'s `needs`, so a red
  # tier 1 fails the required check (#1120).
  tier1:
    name: tier 1 (Oracle Free + Vault)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Only `contents: read`. The workflow's `pull-requests: read` is for the
    # `changes` job, and this job runs the pull request's own code.
    permissions:
      contents: read
    # amd64, and not incidentally: the 11g XE image in tier 2 is published for
    # linux/amd64 only, and Oracle's containers are unsupported under emulation.
    runs-on: ubuntu-latest
    # §4 budgets this tier at under ten minutes, and the timeout is deliberately
    # not that number: a budget is what the lane should cost, a timeout is when
    # to conclude it has hung. Setting them equal would make a slow image pull --
    # which is Docker Hub's day, not ours -- indistinguishable from an Oracle
    # that never reaches healthy, and it would fail the pull rather than report
    # it. Oracle reaches healthy in 30-60 s and the suite is seconds; anything
    # near 20 minutes is stuck, not slow.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[all]`: a lane whose subject is a vendor client has nothing to assert
      # without one.
      - run: pip install -e ".[dev,all]"

      # D3: thick mode is mandatory. Thin mode has no Native Network Encryption,
      # cannot reach 11.2, and cannot log on through an external password store
      # (00-principles.md, "Why thick mode"). So Instant Client is a
      # runtime prerequisite here exactly as it is for an operator, and a lane
      # without it would skip every driver test while reporting green.
      #
      # Basic Lite rather than Basic: it drops the error-message files for
      # languages nobody here reads and is a third of the size. `libaio` is the
      # one system dependency; its package name changed on 24.04, hence the
      # fallback.
      - name: install Oracle Instant Client
        run: |
          # `update` must not be the gate, and the install must be. The runner
          # image carries third-party repositories this job needs nothing from
          # -- Google Chrome's among them -- and one of them serving a corrupt
          # index fails `apt-get update` with exit 100 over a package nobody
          # here is asking for. Seen on 2026-09-09: `E: Failed to fetch
          # https://dl.google.com/linux/chrome-stable/... Hash Sum mismatch`,
          # twice in a row, on a change that touched no CI at all.
          #
          # So a failed update is reported and carried past, and the two lines
          # below decide the step. `libaio` comes from Ubuntu's own archive: if
          # *that* is what is broken, the install fails and the job fails with a
          # message naming the package rather than somebody else's repository.
          sudo apt-get update -qq \
            || echo "::warning::apt-get update reported errors; the install below is the gate"
          sudo apt-get install -y --no-install-recommends libaio1t64 \
            || sudo apt-get install -y --no-install-recommends libaio1
          # Ubuntu 24.04's time_t transition renamed the library to
          # `libaio.so.1t64`, and Instant Client is linked against `libaio.so.1`.
          # Installing the package is therefore not enough: without this the
          # client is present, on LD_LIBRARY_PATH, and still gives DPI-1047.
          lib=$(find /usr/lib -name 'libaio.so.1t64' | head -1)
          if [ -n "$lib" ] && [ ! -e "${lib%1t64}1" ]; then
            sudo ln -s "$lib" "${lib%1t64}1"
            echo "linked ${lib%1t64}1 -> $lib"
          fi
          # One named release, checked against the SHA-256 that Oracle's
          # download page publishes for it (#868). The unversioned "latest" URLs
          # change under the job, and nothing could check what they served.
          # SQL*Plus is for tests/test_password_paths.py, which logs in through a
          # connect string the way an operator does. It unpacks into the same
          # directory as the client. To move to a new release, change `ver`,
          # `dir` and the two hashes, all from
          # https://www.oracle.com/database/technologies/instant-client/linux-x86-64-downloads.html
          ver=23.26.3.0.0
          dir=2326300
          basic=instantclient-basiclite-linux.x64-$ver.zip
          sqlplus=instantclient-sqlplus-linux.x64-$ver.zip
          curl -fsSLO "https://download.oracle.com/otn_software/linux/instantclient/$dir/$basic"
          curl -fsSLO "https://download.oracle.com/otn_software/linux/instantclient/$dir/$sqlplus"
          sha256sum --check --strict - <<SUMS
          88c2b59d473f0d34615556dbee51cb90cce61a9104b4c1c772d13c344fba19c9  $basic
          6570d7939856767cdbb549b51e1423d6a5f53143c57c30c015669706f65a632a  $sqlplus
          SUMS
          sudo mkdir -p /opt/oracle
          sudo unzip -q "$basic" -d /opt/oracle
          sudo unzip -qo "$sqlplus" -d /opt/oracle
          # The directory is found rather than named, so a new release needs only
          # the four values above changed.
          # Checked rather than assumed, because the failure is otherwise silent
          # and lands somewhere else: `find` printing nothing makes `dirname`
          # answer `.`, and the lane then reports DPI-1047 from a step that said
          # it installed the client -- which is the wrong place to start looking.
          libclntsh=$(find /opt/oracle -name 'libclntsh.so*' | head -1)
          if [ -z "$libclntsh" ]; then
            echo "::error::libclntsh.so not found under /opt/oracle -- the Instant Client archive did not unpack as expected"
            find /opt/oracle -maxdepth 2 | head -20
            exit 1
          fi
          client=$(dirname "$libclntsh")
          echo "LD_LIBRARY_PATH=$client" >> "$GITHUB_ENV"
          echo "$client" >> "$GITHUB_PATH"
          echo "installed Instant Client at $client"

      # The compose file rather than `services:`, which is T2's answer applied to
      # CI. Two concrete reasons beyond symmetry: `services:` would duplicate the
      # image pins, and `tests/store/test_hashicorp_cas_conflict.py` asserts on
      # Vault's own error wording, so a second pin is a second thing to forget.
      # And Vault's KV mounts come from a one-shot init container that
      # `services:` cannot express at all -- it would have to be scripted here,
      # which is the compose file written twice.
      # Two calls, because `--wait` fails on a container that has *exited* even
      # when it exited 0, and `vault-init` is a one-shot by design: it mounts kv
      # (v2) and kv1 (v1), sets up the userpass identities, and stops. Waiting on
      # the long-running services by name and starting the one-shot afterwards
      # says what is meant. `wait` then holds pytest until vault-init has
      # finished, and fails the step if it exited non-zero: a half-finished setup
      # would show up as login failures in the personal-path tests.
      # yopass has no healthcheck, because its image has no shell, so `--wait`
      # waits only for it to run. The `yopass_stack` fixture waits on /health.
      # supabase is in a profile of its own, so that a local tier-1 stack does
      # not pull its image; this lane runs it (#1111).
      - name: bring up the tier-1 stack
        working-directory: test
        run: |
          docker compose --profile tier1 --profile supabase up -d --wait vault postgres supabase oracle-free yopass yopass-memcached
          docker compose --profile tier1 up -d vault-init
          docker compose --profile tier1 wait vault-init

      - name: pytest
        env:
          # Turns "no environment" from a skip into a failure. A lane that
          # reported green while skipping everything it exists to run would be
          # worse than no lane, because it would be quoted as evidence.
          SOPULI_TEST_TIER1: required
          SOPULI_TEST_ORACLE_NAME: 23ai Free
        run: pytest

      # Runs on failure too: when Oracle did not come up, its log is the whole
      # diagnosis and the alternative is re-running the job with a debug step
      # somebody has to write first.
      - name: container logs
        if: always()
        working-directory: test
        run: docker compose --profile tier1 --profile supabase logs --tail 100

      - name: tear down
        if: always()
        working-directory: test
        run: docker compose --profile '*' down

  # The lane a prose-only pull request still has to pass, and what makes the
  # skipping above safe (#458).
  #
  # `changes` switches off `lint`, `test`, `install shape` and `tier1` for prose. But three
  # tier-0 tests read exactly the files the prose list ignores:
  #
  # * `tests/test_verification_register.py` reads its register out of
  #   `docs/README.md` and scans every `docs/**/*.md` -- plus `README.md`,
  #   `CLAUDE.md`, `src/**/*.py` and `sql/**/*.sql` -- for `(unverified: <slug>)`
  #   markers;
  # * `tests/test_doc_command_lines.py` parses every fenced `sopuli` command line
  #   under `docs/` against the real CLI;
  # * `tests/test_readme_links.py` checks that every link in `README.md` is
  #   absolute, because PyPI renders it outside the repository (#545).
  #
  # So a prose-only pull request could break either -- a typo'd slug, a register
  # entry flipped to `verified` with a marker left behind, a documented flag the
  # CLI has not got -- and CI reported green. Found on #457, which was docs-only,
  # skipped every lane, and was green only because the suite was run by hand.
  #
  # **Measured before this was written** (#458): those two modules account for
  # *all* 21 ignored files the suite opens, and they run in 0.75 s. The other fix
  # direction -- deleting from the prose list every path they read, which is
  # effectively all of `docs/**` -- buys the same safety for about twenty billed
  # minutes here plus ten of tier 1 on every documentation pull request, which is
  # the whole cost the list exists to avoid.
  #
  # It runs *only* when the heavy lanes do not. On a code pull request the `test`
  # matrix already runs these modules, so a second copy would be duplication
  # rather than coverage.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[dev]` alone, not `[dev,all]`: every module here is tier 0. Some import
      # the package, to walk the real command tree or look a name up, so it has to be
      # installed -- but none opens a socket, so no extra is needed and the
      # lane stays cheap, which is the entire argument for having it.
      - run: pip install -e ".[dev]"

      - name: the tier-0 tests that read prose
        run: pytest tests/test_verification_register.py tests/test_decision_register.py tests/test_decision_log.py tests/test_doc_command_lines.py tests/test_doc_lists.py tests/test_doc_sections.py tests/test_doc_symbols.py tests/test_measurements.py tests/test_pending_work.py tests/test_readme_links.py tests/test_warning_codes.py

  # The one check to require, and the reason it exists rather than requiring the
  # jobs above directly.
  #
  # `changes` makes prose-only pull requests skip those jobs, and a skipped job
  # reports `skipped`, which branch protection accepts -- that much holds for
  # `lint`, whose context is called `lint` either way. **It does not hold for a
  # matrix.** Measured on a prose-only pull request against this branch (#379):
  # a skipped matrix job never expands, so instead of seven contexts named
  # `test (ubuntu-latest, py3.11)` and so on, it publishes exactly one, named
  # with the literal expression in the job's `name:`. Requiring the cell names
  # would therefore leave seven contexts that
  # were never created, pending forever, which is the whole failure #375 set out
  # to avoid, moved one step along.
  #
  # So the `main` ruleset requires this job instead of naming any of them. It has a
  # fixed name, it runs on every pull request, and it is red whenever anything
  # above is. That also closes the other edge: a `changes` job that *failed*
  # would skip everything downstream, and skipped-passes would wave the pull
  # request through -- here it is a dependency like any other, and a failure is
  # a failure.
  #
  # `if: always()` rather than a condition on `changes`: without it this job
  # would itself be skipped when its dependencies were, and a required check
  # that is skipped for the right reason is indistinguishable from one skipped
  # for the wrong one.
  ci-ok:
    name: ci ok
    needs: [changes, lint, test, install-shape, release-build, tier1, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every lane passed or was skipped
        env:
          # `join(needs.*.result, ' ')` rather than four separate expressions:
          # a job added above and forgotten here would otherwise be unguarded,
          # and this is the check that is supposed to notice.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a lane reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "every lane passed or was skipped"
