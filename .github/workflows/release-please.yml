name: release-please

# Maintains a standing release PR against main: accumulated changelog plus the
# version bump. Merging that PR is the explicit act that cuts the tag and the
# GitHub Release — nothing here tags directly. See docs/workflow.md.
#
# The same merge then builds the distributions and publishes them to PyPI
# (#545). Both are jobs here rather than a separate workflow on
# `release: published`, because release-please creates the Release with this
# workflow's GITHUB_TOKEN, and GitHub starts no workflow run for an event that
# token caused -- a separate workflow would silently never run. On every push
# that cuts no release, `build`, `publish` and `release-assets` show as skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at the top level; each job asks for exactly what it uses.
permissions: {}

# A push landing while a previous run is still open would otherwise race on the
# release PR. Never cancel in progress: a cancelled run can leave the PR stale.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pinned by hash, the build backend included, so a new release of any of
      # them cannot change the published files unseen (#868). Without
      # `--no-deps`, `--require-hashes` refuses a dependency the file does not
      # pin. `--no-isolation` makes `build` use that pinned hatchling rather
      # than install an unpinned one into an isolated environment. ci.yml's
      # `release-build` job runs these same steps on every pull request.
      - run: python -m pip install --require-hashes -r .github/requirements/release.txt
      - run: python -m pip check
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Separate from `build` on purpose: the PEP 740 attestation this job produces
  # vouches for the files `build` handed over, and this job holds the one
  # credential -- a short-lived OIDC token PyPI trusts -- and nothing else.
  # The `pypi` environment's required reviewers are the last point at which a
  # release can be stopped.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sopuli-dba
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Attestations are on by default from v1.11; do not set `attestations: false`.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The same files on the GitHub release, each with a Sigstore bundle (#947).
  # Scorecard's Signed-Releases check reads release assets, not PyPI, so the PEP
  # 740 attestations above do not count for it. A job of its own, after
  # `publish`, so `publish` keeps only its OIDC token: attaching assets needs
  # `contents: write`, and signing needs an OIDC token of this job's own. It
  # takes the `dist` artifact `publish` uploaded, never a rebuild, so the
  # release carries the bytes that are on PyPI.
  release-assets:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Writes `<file>.sigstore.json` beside each file, then verifies each bundle
      # against this workflow's identity, so a bundle that would not verify for
      # a user stops the job before anything is attached. Its own release upload
      # works only on a `release` event, which this run is not, so it is off and
      # the step below attaches the files.
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
          upload-signing-artifacts: false
      - name: attach the files and their bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
