# The four ways to give the tool the password of the account it connects as.
# A target's `admin:` block says which account that is, and its `auth:` says
# where the password comes from. The tool refuses to connect to a target that
# names no source.
#
# Read this one for `admin:`. The targets are ordinary pluggable databases, and
# one application uses them all so the file has something to manage.
#
# The four sources, from the most recommended to the least. The tool never
# picks one for you and never falls back from one to another: it uses the one
# the target names.
#
#   external  something outside the tool proves who you are: an Oracle wallet
#             on this machine, Kerberos, or operating-system authentication
#   vault     the password is a secret in a vault
#   prompt    you type it when a run starts
#   env       an environment variable holds it (flagged as low-assurance)
#
# Check it before you use it:
#     sopuli --config admin-credentials.yaml config validate
#
# Full reference: ../docs/design/01-configuration.md (section 3a, `admin:`)

# yaml-language-server: $schema=../docs/schemas/sopuli-config-3.3.schema.json

version: 1

# Each vault is a separate server with its own token, so each names its own
# variable. Without `token:`, every vault would take the same token, from
# SOPULI_VAULT_TOKEN, VAULT_TOKEN or ~/.vault-token, and a run that reads
# from two vaults would fail to log in to one of them.
vaults:
  vault-dev:
    type: hashicorp
    addr: https://vault-dev.example.com
    mount: kv
    kv_version: 2
    non_production: true
    auth: { method: token, token: { env: SOPULI_VAULT_TOKEN_DEV } }
  vault-qa:
    type: hashicorp
    addr: https://vault-qa.example.com
    mount: kv
    kv_version: 2
    non_production: true
    auth: { method: token, token: { env: SOPULI_VAULT_TOKEN_QA } }
  vault-prod:
    type: hashicorp
    addr: https://vault.example.com
    mount: kv
    kv_version: 2
    auth: { method: token, token: { env: SOPULI_VAULT_TOKEN_PROD } }

targets:
  # external, here an Oracle wallet. The `dsn` must be a TNS alias, here
  # ACME_PROD_ALPHA, because the wallet stores its password under that alias.
  # There is no `username:` either, because the wallet holds it too. The tool
  # refuses the file if the `dsn` is a host:port/service string, or if a
  # `username:` is written. `sopuli doctor` reports whether it can find a
  # readable wallet through TNS_ADMIN.
  - name: appdb-prod-alpha
    type: oracle
    environment: prod
    vault: vault-prod
    dsn: ACME_PROD_ALPHA
    admin: { auth: external }
    oracle: { scope: pdb, container: alphaprod }

  # prompt: you type the password at the start of a run, and the tool asks once
  # for each place it is written. A run with no terminal, such as a scheduled
  # job, cannot answer, so a verb that changes something refuses to start.
  - name: appdb-lab-alpha
    type: oracle
    environment: lab
    vault: vault-dev
    dsn: "db-lab.example.com:1521/alphalab.pdb.example.com"
    admin: { username: C##SOPULI_SVC, auth: prompt }
    oracle: { scope: pdb, container: alphalab }

  # env: the password is in an environment variable. `password_env` names it.
  # Without it, the tool reads SOPULI_DB_ADMIN_PASSWORD. Environment variables
  # leak easily, so this source is flagged as low-assurance. `sopuli doctor`
  # prints a note that names the variable, and every command that connects
  # records it in its JSON output as SOPULI-W022. Use it to get started, not
  # to stay.
  - name: appdb-sandbox-alpha
    type: oracle
    environment: sandbox
    vault: vault-dev
    dsn: "192.0.2.10:1521/alphasandbox.example.com"
    admin:
      username: C##SOPULI_SVC
      auth: { method: env, password_env: SOPULI_SANDBOX_ADMIN_PASSWORD }
    oracle: { scope: pdb, container: alphasandbox }

target_sets:
  # vault: the password is a secret, read from the target's own vault. The
  # `{env}` in the ref makes it a different secret in each environment, so dev
  # and qa can have different passwords:
  #     dev  ->  vault-dev: ops/sopuli/dev/admin, field `password`
  #     qa   ->  vault-qa:  ops/sopuli/qa/admin,  field `password`
  # The tool logs in to each vault once per run, the way that vault's `auth:`
  # says, and reads the secret there. This suits a machine that already has a
  # vault login, and it needs no prompt.
  appdb:
    type: oracle
    name: "appdb-{env}-{tenant}"
    dsn: "{host}:1521/{tenant}{env}.pdb.example.com"
    environment: "{env}"
    vault: "{vault}"
    admin:
      username: C##SOPULI_SVC
      auth: { method: vault, secret: "ops/sopuli/{env}/admin#password" }
    oracle: { scope: pdb, container: "{tenant}{env}" }
    for_each:
      env:
        dev:
          host: db-dev.example.com
          vault: vault-dev
          tenant: [alpha, beta]
        qa:
          host: db-qa.example.com
          vault: vault-qa
          tenant: [alpha, beta]

policies:
  app-standard:
    password:
      length: 24
      charset: alnum_safe
      first_char: alpha
      require: { upper: 1, lower: 1, digit: 1, special: 1 }

# Every target here is a tenant database, so the application can use the short
# form, which applies to all targets. The explicit targets have no `tenant`
# label, so the ref uses `{target}`, the target's name, which every target has.
accounts: [acme_web_user]
secret_template: "apps/{target}#DB_CREDENTIALS/{account}"
policy: app-standard
