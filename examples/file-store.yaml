# A `file` store: the passwords kept in one age-encrypted file on this machine,
# in place of a vault server. It is for local development and CI, where
# running a vault is more than the job needs.
#
# It is not for production, and the tool says so: every run that opens a file
# store warns with SOPULI-W070. Three more limits follow from what it is:
#
#   - only this machine can read it. An application on another machine, or
#     External Secrets Operator, cannot fetch a password from it;
#   - the personal-account commands (UC-2) refuse it, because those passwords
#     belong to real people;
#   - it has no compare-and-set, so two runs at once could overwrite each
#     other. A command that changes it needs `locking: advisory-only`, which
#     says you know that.
#
# It needs the file extra:  pip install "sopuli-dba[file]"
# The identity is an age key. Make one with
#     age-keygen -o ~/sopuli-file/identity.txt
# and keep it readable only by you. ../docs/local-testing.md has a first run
# with a file store.
#
# Check it before you use it:
#     sopuli --config file-store.yaml config validate
#
# Full reference: ../docs/design/01-configuration.md (section 3a, `vaults:`)

# yaml-language-server: $schema=../docs/schemas/sopuli-config-4.0.schema.json

version: 1

vaults:
  vault-file:
    type: file
    # The store's file. An absolute path, or one that starts with `~`. A
    # relative path would name a different file from each working directory.
    # A file that does not exist yet is an empty store, and the first change
    # creates it.
    addr: ~/sopuli-file/acme-dev.age
    # The age identity that decrypts the store. `{ env: NAME }` suits a CI job
    # that keeps the key in a secret variable; `{ file: PATH }` suits a
    # workstation.
    identity: { file: ~/sopuli-file/identity.txt }
    # Who else can decrypt the file, as `age-keygen -y` prints their public
    # keys: here a colleague's. The identity's own key is always a recipient.
    # Absent means the identity's key alone.
    recipients:
      - age13ew8qgf5ustm9t0ckerem09e928n33pzdlfccmdr343msctm5c5s4esmd5
    # How many versions of each password the file keeps. Absent means 10.
    max_versions: 5
    locking: advisory-only
    # A file store must never hold a production password. With this, the tool
    # refuses a `prod` target that names this store.
    non_production: true

targets:
  - name: dev-alpha
    type: oracle
    environment: dev
    vault: vault-file
    dsn: "db-dev.example.com:1521/alphadev.pdb.example.com"
    admin: { username: C##SOPULI_SVC, auth: { method: env } }
    oracle: { scope: pdb, container: alphadev }

policies:
  app-standard:
    password:
      length: 24
      charset: alnum_safe
      first_char: alpha
      require: { upper: 1, lower: 1, digit: 1, special: 1 }

# In a file store a ref is a path and a field, as in a HashiCorp store.
accounts: [acme_web_user, acme_batch_user]
secret_template: "acme/{target}#DB_CREDENTIALS/{account}"
policy: app-standard
