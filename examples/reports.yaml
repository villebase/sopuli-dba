# The rules `sopuli report accounts` checks every account against (UC-5).
#
# A report reads every account on each declared target, declared or not, and
# changes nothing. It is the one kind of command that lists the accounts this
# file does not declare. The `reports:` section at the end says what the
# accounts on those targets should look like: which database profile they sit
# on, and what their password limits must be.
#
# Only Oracle can run the reports yet.
#
# Check it before you use it:
#     sopuli --config reports.yaml config validate
# Then run the report:
#     sopuli --config reports.yaml report accounts
#
# A real run, with its output: ../docs/local-testing.md section 9a.
# Full reference: ../docs/design/01-configuration.md section 8a, and
# ../docs/use-cases/uc-05-fleet-reports.md.

# yaml-language-server: $schema=../docs/schemas/sopuli-config-5.1.schema.json

version: 1

vaults:
  vault-prod:
    type: hashicorp
    addr: https://vault.example.com:8200
    mount: kv
    kv_version: 2
    auth: { method: token }

defaults:
  vault: vault-prod
  policy: app-standard

targets:
  - name: dev-alpha
    type: oracle
    environment: dev
    dsn: "db-dev.example.com:1521/ALPHA"
    admin: { username: C##SOPULI_SVC, auth: { method: env } }
    labels: { env: dev }

  - name: prod-alpha
    type: oracle
    environment: prod
    dsn: "db-prod.example.com:1521/ALPHA"
    admin: { username: C##SOPULI_SVC, auth: { method: env } }
    labels: { env: prod }

  - name: prod-beta
    type: oracle
    environment: prod
    dsn: "db-prod.example.com:1521/BETA"
    admin: { username: C##SOPULI_SVC, auth: { method: env } }
    labels: { env: prod }

groups:
  prod:
    match: { env: prod }

policies:
  app-standard:
    password:
      length: 24
      charset: alnum_safe
      first_char: alpha
      require: { upper: 1, lower: 1, digit: 1, special: 1 }
    # The profile the application accounts must sit on. The report checks
    # it from here, so a `reports:` rule never names it a second time.
    account:
      profile: ACME_APP

applications:
  - name: acme
    accounts: [acme_web_user, acme_batch_user]
    secret_template: "vault-prod:acme/{target}#DB_CREDENTIALS/{account}"

# ---------------------------------------------------------------------------
# What the report checks. There are no built-in rules. An account that no
# application and no rule here names is listed as undeclared: information,
# which never changes the exit code. A declared account that no
# rule gives a profile or a setting is listed as "no rule". A setting no rule
# names is not compared. Every account's lock is checked.
#
# `settings:` uses words that are not one product's. A key that only one
# product has goes in that product's block: here `oracle:`, which holds a
# rule's database profile and the list of profiles at the end.
# ---------------------------------------------------------------------------
reports:
  accounts:
    # Technical accounts on the production databases, named by name and by
    # pattern. `*` is the only wildcard, and names are compared in upper case.
    # Oracle's own accounts, such as DBSNMP, are left out of the report unless
    # a rule names them, as this one does. A profile and a setting both:
    # the accounts must sit on TECH_NOEXPIRE, and their passwords must never
    # expire. A pattern covers every account it matches, locked ones too, so
    # keep it to accounts that should all pass.
    - accounts: [DBSNMP, "ACME_SVC_*"]
      targets: { group: prod }
      settings: { password_lifetime: unlimited }
      oracle: { profile: TECH_NOEXPIRE }

    # The application accounts, by name, on every target, because the rule
    # has no `targets:`. By name rather than `acme_*_user`, so that a leftover
    # account nobody declares still shows as undeclared. `settings:` only:
    # their profile comes from the policy above, and a rule may not give
    # `oracle.profile` to an account an application names.
    - accounts: [acme_web_user, acme_batch_user]
      settings: { failed_login_limit: 10 }

    # The schema owners: nobody logs in as them, so their lock is the point.
    # `login: refused` passes only where somebody locked the account. An open
    # owner is a problem, and so is one locked by failed logins, because
    # somebody tried, and that lock ends by itself.
    - accounts: ["ACME_OWNER*"]
      login: refused

    # A profile only: the reporting account must sit on ACME_REPORTING. What
    # that profile's limits must be is said once, in `oracle.profiles` below.
    - accounts: [acme_report_user]
      targets: { group: prod }
      oracle: { profile: ACME_REPORTING }

  # What a database profile's limits must be, for every account on it.
  # `unlimited` matches only an unlimited value, and a number is the largest
  # value allowed. Where a rule and an entry here set one setting to two
  # values, that check reports "not checked". An entry here does not expect
  # the profile to exist on every target. A rule's `oracle.profile` does, on
  # the targets the rule covers, and so does a policy's `account.profile`, on
  # every target its accounts are bound to: ACME_APP must exist on all three
  # targets above.
  oracle:
    profiles:
      - name: TECH_NOEXPIRE
        settings: { password_lifetime: unlimited, failed_login_limit: 10 }
      - name: ACME_APP
        settings: { password_lifetime: unlimited }
      - name: ACME_REPORTING
        settings: { password_lifetime: 90, failed_login_limit: 5 }
