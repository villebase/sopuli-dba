# sopuli-dba test stack
#
# Which profiles start, and which of them CI runs, is in README.md.
#
# Profiles keep the inner loop fast, and they are additive: every tier0 service also
# carries tier1 and tier2, so moving up a tier adds services and recreates nothing.
#   docker compose --profile tier0 up -d     # Vault + PostgreSQL + Yopass, seconds
#   docker compose --profile tier1 up -d     # + Oracle Free, ~30-60 s to healthy
#   docker compose --profile tier2 up -d     # + older Oracle lines, ~90 s once pulled
#   docker compose --profile nne   up -d     # Vault + Oracle requiring NNE, on 1525; see README.md
#   docker compose --profile emulators up -d # lowkey-vault, on 8443
#   docker compose --profile postgres-matrix up -d # PostgreSQL 13 to 18, on 5413 to 5418
#   docker compose --profile mysql-matrix up -d    # MySQL 8.0, 8.4, 9.7, on 3380, 3384, 3397
#   docker compose --profile tier0 --profile pgbouncer up -d # + PgBouncer, on 6432 and 6433
#   docker compose --profile tier0 --profile supabase up -d  # + Supabase's database, on 5440
#   docker compose --profile oracle19c up -d # 19.3 EE, maintainer-only; see the service
#   docker compose --profile oracle19c-ru up -d # 19.19 EE, arm64 hosts only
#   docker compose --profile oracle12c up -d # 12.2.0.1 EE, maintainer-only
#
# TEARDOWN: use `docker compose --profile '*' down`. A plain `docker compose down` is
# a SILENT NO-OP here — every service below carries a profiles: key, so with no
# profile selected it matches nothing and exits 0. `--profile tier0 down` is worse
# than useless: it removes tier0's services, leaves Oracle running, and then cannot
# remove the network. See README.md.
#
# PORTS are published on loopback only, 127.0.0.1 and ::1. README.md says why.
#
# Oracle containers are deliberately long-running: tests reset state by dropping and
# recreating accounts, never by recreating the container. Note that NOTHING HERE
# ENFORCES THAT — no service but the two 19c ones and 12.2 declares a volume, so
# any teardown discards the database and the next `up` re-initialises from
# scratch. oracle-19c and oracle-19c-ru keep their datafiles in named volumes
# because their first start takes tens of minutes, and oracle-12c because its
# one-time init lives in them; `down -v` is the one form that discards them.
#
# A SECOND CLONE can run its own tier0/tier1 stack beside this one. Set
# COMPOSE_PROJECT_NAME and the four SOPULI_TEST_*_PORT variables in that clone's
# environment; the suite reads the same five. The project name overrides `name:`
# below. Without a project name of its own, a second clone's `up` recreates the
# first clone's containers. A second clone that starts postgres-matrix also sets
# SOPULI_TEST_POSTGRES13_PORT to SOPULI_TEST_POSTGRES18_PORT, which the suite
# does not read. See README.md.

name: sopuli-test

# The settings postgres-13 to postgres-18 share. Compose ignores a top-level
# key that starts with `x-`.
x-postgres-matrix: &postgres-matrix
  profiles: [postgres-matrix]
  command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - logging_collector=on
    - -c
    - log_filename=postgresql.log
  environment:
    POSTGRES_PASSWORD: sopuli-test
    POSTGRES_DB: sopuli
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 20

# The settings mysql-80 to mysql-97 share.
x-mysql-matrix: &mysql-matrix
  profiles: [mysql-matrix]
  environment:
    MYSQL_ROOT_PASSWORD: sopuli-test
    MYSQL_DATABASE: sopuli
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psopuli-test --silent"]
    interval: 5s
    timeout: 3s
    retries: 30

services:

  # ---------------------------------------------------------------- vault ---
  # Dev mode: in-memory, root token known, unsealed. Never resembles production,
  # which is the point — production auth paths are exercised against real OCI.
  vault:
    # Pinned rather than :latest: tests/store/test_hashicorp_cas_conflict.py
    # asserts on Vault's own error wording, so an upstream image bump has to
    # be a deliberate, reviewable line here -- not something that silently
    # changes what the regression test is measuring against.
    image: hashicorp/vault:2.0.4
    profiles: [tier0, tier1, tier2, nne]
    # No cap_add: [IPC_LOCK] here on purpose. 2.0.2 removed the cap_ipc_lock
    # capability at build time so Vault can run in common container runtimes
    # without it, with disable_mlock = true the advised setting instead --
    # carrying the capability request is obsolete, not merely unnecessary.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: sopuli-test-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:${SOPULI_TEST_VAULT_PORT:-8200}:8200"
      - "[::1]:${SOPULI_TEST_VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mounts BOTH KV versions, so the store-capability degradation paths
  # (00-principles P2) are covered in one container.
  #
  # It also sets up the identities that `vault_path` delivery (UC-2 §6.6) is
  # tested with. sopuli writes to kv/personal/<ACCOUNT>/<target>, and a person
  # reads it through a policy keyed on their entity's `db_account` metadata:
  #   - personal-reader: `read` on their own path, attached to every userpass user.
  #   - personal-writer: the DBA's `create` and `update`, with no `read`.
  #   - personal-read: `read` on the same paths, which sopuli has to refuse.
  #   - userpass users alice (db_account ACME_DEV_ALICE, the tier-1 Oracle
  #     tests' personal account), bob (ACME_DEV_BOB) and carol (no db_account).
  #   - token sopuli-test-personal-writer, with personal-writer, and token
  #     sopuli-test-personal-writer-read, with personal-writer and personal-read.
  #     Both live 768h, the dev server's maximum; vault-init recreates an
  #     expired one.
  # `tests/conftest.py` `VaultStack` carries the same names. The passwords go
  # through stdin, as `password=-`.
  vault-init:
    image: hashicorp/vault:2.0.4
    profiles: [tier0, tier1, tier2, nne]
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: sopuli-test-root
    entrypoint:
      - sh
      - -c
      - |
        set -e
        vault secrets enable -path=kv   -version=2 kv || true
        vault secrets enable -path=kv1  -version=1 kv || true
        echo "kv (v2) and kv1 (v1) mounted"

        vault auth list | grep -q '^userpass/' || vault auth enable userpass
        accessor=$$(vault read -field=accessor sys/auth/userpass)
        vault policy write personal-reader - <<'EOF'
        path "kv/data/personal/{{identity.entity.metadata.db_account}}/*" {
          capabilities = ["read"]
        }
        EOF
        vault policy write personal-writer - <<'EOF'
        path "kv/data/personal/*" {
          capabilities = ["create", "update"]
        }
        path "kv/metadata/personal/*" {
          capabilities = ["create", "update"]
        }
        EOF
        vault policy write personal-read - <<'EOF'
        path "kv/data/personal/*" {
          capabilities = ["read"]
        }
        path "kv/metadata/personal/*" {
          capabilities = ["read"]
        }
        EOF
        vault token lookup sopuli-test-personal-writer >/dev/null 2>&1 \
          || vault token create -id=sopuli-test-personal-writer \
               -policy=personal-writer -ttl=768h >/dev/null
        vault token lookup sopuli-test-personal-writer-read >/dev/null 2>&1 \
          || vault token create -id=sopuli-test-personal-writer-read \
               -policy=personal-writer -policy=personal-read -ttl=768h >/dev/null
        # A person: a userpass user, and an entity with an alias for that user.
        # The second argument is the entity's db_account; carol has none.
        # The alias is created unless the entity already has one on this mount.
        person() {
          printf '%s' "sopuli-test-$$1" | vault write "auth/userpass/users/$$1" \
            password=- token_policies=personal-reader >/dev/null
          vault write -force "identity/entity/name/$$1" $${2:+metadata=db_account=$$2} >/dev/null
          case "$$(vault read -field=aliases "identity/entity/name/$$1")" in
            *"$$accessor"*) ;;
            *) vault write identity/entity-alias name="$$1" mount_accessor="$$accessor" \
                 canonical_id="$$(vault read -field=id "identity/entity/name/$$1")" >/dev/null ;;
          esac
        }
        person alice ACME_DEV_ALICE
        person bob ACME_DEV_BOB
        person carol
        echo "userpass users alice, bob and carol, and the personal-path policies, set up"
    restart: "no"

  # --------------------------------------------------------------- yopass ---
  # The Yopass server that `one_time_link` delivery (UC-2 §6.6) is tested with,
  # and the memcached it stores secrets in. Default flags, so /config reports
  # what an unlicensed server reports out of the box. Pinned, because the method
  # reads the server's /config keys and the web page's link format. The image is
  # distroless, with no shell to run a healthcheck in, so `tests/conftest.py`
  # waits on /health instead.
  yopass:
    image: jhaals/yopass:16.0.1
    profiles: [tier0, tier1, tier2]
    command: ["--memcached=yopass-memcached:11211"]
    depends_on: [yopass-memcached]
    ports:
      - "127.0.0.1:${SOPULI_TEST_YOPASS_PORT:-1337}:1337"
      - "[::1]:${SOPULI_TEST_YOPASS_PORT:-1337}:1337"

  yopass-memcached:
    image: memcached:1.6-alpine
    profiles: [tier0, tier1, tier2]

  # ------------------------------------------------------------- postgres ---
  # Tier 0 driver work and the fast inner loop. Cheap enough to run a matrix.
  # The matrix's two settings, so invariant 15's test can read the log back
  # with pg_read_file() and query pg_stat_statements
  # (tests/driver/test_postgres_password_live.py).
  postgres:
    image: postgres:16-alpine
    profiles: [tier0, tier1, tier2]
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - logging_collector=on
      - -c
      - log_filename=postgresql.log
    environment:
      POSTGRES_PASSWORD: sopuli-test
      POSTGRES_DB: sopuli
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES_PORT:-5432}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------ postgres matrix ---
  # PostgreSQL 13 to 18, for the probes in sql/postgres/ (#1032). Each major
  # version has its own port variable, so a second clone can run the matrix
  # beside the first. A moving tag, as postgres above: a probe's header records
  # the release `SHOW server_version` read, never the tag.
  #
  # Two settings, the same as postgres above, for probe 01: pg_stat_statements
  # is preloaded, and the log goes to one file in the data directory, so that a
  # superuser can read it back with pg_read_file(). `docker logs` therefore
  # shows only the start of the log.
  postgres-13:
    <<: *postgres-matrix
    image: postgres:13
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES13_PORT:-5413}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES13_PORT:-5413}:5432"

  postgres-14:
    <<: *postgres-matrix
    image: postgres:14
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES14_PORT:-5414}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES14_PORT:-5414}:5432"

  postgres-15:
    <<: *postgres-matrix
    image: postgres:15
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES15_PORT:-5415}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES15_PORT:-5415}:5432"

  postgres-16:
    <<: *postgres-matrix
    image: postgres:16
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES16_PORT:-5416}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES16_PORT:-5416}:5432"

  postgres-17:
    <<: *postgres-matrix
    image: postgres:17
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES17_PORT:-5417}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES17_PORT:-5417}:5432"

  postgres-18:
    <<: *postgres-matrix
    image: postgres:18
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES18_PORT:-5418}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES18_PORT:-5418}:5432"

  # MySQL 8.0, 8.4 LTS and 9.7, for the probes in sql/mysql/ (#1202). Moving
  # tags, as postgres-13 to postgres-18: a probe's header records the release
  # `SELECT VERSION()` read, never the tag. Each has its own port variable, so a
  # second clone can run the matrix beside the first. The servers run with the
  # image's defaults; a probe sets any log it reads and puts it back.
  mysql-80:
    <<: *mysql-matrix
    image: mysql:8.0
    ports:
      - "127.0.0.1:${SOPULI_TEST_MYSQL80_PORT:-3380}:3306"
      - "[::1]:${SOPULI_TEST_MYSQL80_PORT:-3380}:3306"

  mysql-84:
    <<: *mysql-matrix
    image: mysql:8.4
    ports:
      - "127.0.0.1:${SOPULI_TEST_MYSQL84_PORT:-3384}:3306"
      - "[::1]:${SOPULI_TEST_MYSQL84_PORT:-3384}:3306"

  mysql-97:
    <<: *mysql-matrix
    image: mysql:9
    ports:
      - "127.0.0.1:${SOPULI_TEST_MYSQL97_PORT:-3397}:3306"
      - "[::1]:${SOPULI_TEST_MYSQL97_PORT:-3397}:3306"

  # ------------------------------------------------------------ pgbouncer ---
  # PgBouncer in front of postgres above, for sql/postgres/08_pgbouncer_probe.py
  # (#1045). Start it with tier 0, which runs postgres:
  #   docker compose --profile tier0 --profile pgbouncer up -d
  # pgbouncer refuses a client that sends the startup parameter `options`, as
  # PgBouncer does by default. pgbouncer-ignore lets it in and drops it
  # (ignore_startup_parameters). Each has a database `session` and a database
  # `transaction`, one for each pool mode; pgbouncer/pgbouncer.ini says how. A
  # third-party image, as PgBouncer publishes none, and pinned, so that the
  # release the probe's header records is the one that runs.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    profiles: [pgbouncer]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    ports:
      - "127.0.0.1:${SOPULI_TEST_PGBOUNCER_PORT:-6432}:6432"
      - "[::1]:${SOPULI_TEST_PGBOUNCER_PORT:-6432}:6432"

  pgbouncer-ignore:
    image: edoburu/pgbouncer:v1.26.0-p0
    profiles: [pgbouncer]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/ignore.ini"]
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    ports:
      - "127.0.0.1:${SOPULI_TEST_PGBOUNCER_IGNORE_PORT:-6433}:6432"
      - "[::1]:${SOPULI_TEST_PGBOUNCER_IGNORE_PORT:-6433}:6432"

  # ------------------------------------------------------------- supabase ---
  # The PostgreSQL image a Supabase project runs, on its own, for
  # tests/driver/test_postgres_supabase_live.py (#1111). It preloads supautils,
  # which refuses a change to a role in supautils.reserved_roles by anyone but a
  # superuser; guardrail check 8 reads the same setting. The rest of a Supabase
  # stack (API gateway, auth, storage) is left out: the tool talks to the
  # database only. POSTGRES_PASSWORD is the password of both `postgres` (not a
  # superuser on Supabase) and `supabase_admin` (the superuser). Pinned, because
  # the reserved list changes between releases. From Docker Hub: Supabase
  # publishes the same image, by digest, on public.ecr.aws, and CI's pull from
  # there failed with "toomanyrequests: Data limit exceeded". CI's tier-1 lane starts it with
  # `--profile tier1 --profile supabase`. Beside a local tier-0 stack:
  #   docker compose --profile tier0 --profile supabase up -d
  # The healthcheck goes over TCP, because the image's init runs a server that
  # listens on the socket only.
  supabase:
    image: supabase/postgres:17.6.1.095
    profiles: [supabase]
    environment:
      POSTGRES_PASSWORD: sopuli-test
    ports:
      - "127.0.0.1:${SOPULI_TEST_SUPABASE_PORT:-5440}:5432"
      - "[::1]:${SOPULI_TEST_SUPABASE_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --------------------------------------------------------------- oracle ---
  # 23ai/26ai Free: CDB + PDB, common users, gradual password rollover.
  # The only Oracle a contributor can definitely pull, so tier 1 lives here and
  # the public suite must be green on it alone.
  oracle-free:
    image: gvenzl/oracle-free:latest
    profiles: [tier1, tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
      APP_USER: sopuli_probe
      APP_USER_PASSWORD: sopuli-test
    ports:
      - "127.0.0.1:${SOPULI_TEST_ORACLE_PORT:-1521}:1521"
      - "[::1]:${SOPULI_TEST_ORACLE_PORT:-1521}:1521"
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # 21c XE — an older CDB line.
  oracle-xe21:
    image: gvenzl/oracle-xe:21-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1522:1521", "[::1]:1522:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # 18c XE — 12.2+ password lengths, no rollover. A useful negative case:
  # `--strategy rollover` must fail at plan time here, not at execution.
  oracle-xe18:
    image: gvenzl/oracle-xe:18-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1523:1521", "[::1]:1523:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  # 11g XE — non-CDB, 30-byte passwords, 10G/11G verifiers, DBA_AUDIT_TRAIL.
  # Tag verified 2026-08-08 (04-testing.md T1): pulls, starts in ~15 s, accepts
  # the init profiles. Ships pre-built datafiles, so it is the FASTEST Oracle in
  # this stack, not the slowest — hence the short start_period.
  # Connects as SID XE, not a PDB service name. linux/amd64 only.
  oracle-xe11:
    image: gvenzl/oracle-xe:11.2.0.2-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1524:1521", "[::1]:1524:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ----------------------------------------------------- oracle 19c (#548) ---
  # 19.3.0.0.0 Enterprise Edition, Oracle's own prebuilt image. MAINTAINER-ONLY:
  # pulling it takes an Oracle account, the licence accepted for the
  # database/enterprise repository, and `docker login container-registry.oracle.com`
  # -- see docs/maintainer-environments.md. It cannot be redistributed, so it never runs in
  # CI and the suite skips rather than fails without it.
  #
  # Profile `oracle19c`, not `tier3`: tier 3 is the whole maintainer matrix
  # (04-testing.md §2), most of which is real cloud services no compose file can
  # start, so `--profile tier3` would promise something this file cannot keep.
  # A profile named for the one licence-gated service also means nothing that
  # already exists pulls it by accident. It carries no vault/postgres; combine
  # it with `--profile tier1` when a run needs the vault.
  #
  # 19.3 is the base release: it has no gradual password rollover (19.12+), and
  # an OCI estate runs a later RU. Record results as 19.3.0.0.0, never "19c".
  #
  # The one service here WITH a volume, because first start runs DBCA and takes
  # tens of minutes (docs/maintainer-environments.md). `down` keeps the volume;
  # `down -v` throws the database away and the next `up` creates it again.
  # Init: the same oracle-init/01_test_profiles.sql as tier 2, run once after
  # DBCA -- but inside ORCLPDB1 rather than CDB$ROOT, through the wrapper in
  # oracle-init-19c/. This image keeps COMMON_USER_PREFIX = C##, so SOPULI_*
  # cannot be a common profile here (ORA-65140); the wrapper says why.
  oracle-19c:
    # sha256:2df7530ac81566f8659e13d41fda029e5c08a983147e5b372b173476a74ab62e
    # (pulled 2026-09-26)
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    profiles: [oracle19c]
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: sopuli-test
    ports: ["127.0.0.1:1526:1521", "[::1]:1526:1521"]
    volumes:
      - oracle19c-data:/opt/oracle/oradata
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-19c:/opt/oracle/scripts/setup:ro
    healthcheck:
      # The image's own check: database role PRIMARY and a PDB open READ WRITE.
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 3600s

  # ------------------------------------------- oracle 19.19 (#565, closed) ---
  # 19.19.0.0.0 Enterprise Edition, from the same registry repository and on the
  # same terms as oracle-19c above: maintainer-only, never in CI. The one pullable
  # 19c past 19.12, so the one that can open a gradual-rollover window.
  #
  # THE TAG IS linux/arm64 ONLY, AND IT NEEDS AN arm64 HOST. The manifest is a
  # single-platform one, not a list with an amd64 entry (checked 2026-09-28), and
  # the build label is RDBMS_19.19.0.0.0DBRU_LINUX.ARM64. Under Docker Desktop's
  # QEMU emulation on x86 it does not start: DBCA dies at 9% with ORA-00443,
  # and the PMON trace says ORA-01096: program version (19.0.0.0.0) incompatible
  # with instance (0.0.0.14.238) -- measured 2026-09-28, two minutes in. That is
  # emulation failing, not slowness, so waiting longer does not help.
  #
  # `platform:` makes the requirement explicit rather than leaving it to a pull
  # warning. On an arm64 host such as Apple Silicon it should run natively; that
  # is untested, the service is written by analogy with oracle-19c above, and no
  # issue tracks it since #565 closed in favour of an OCI DB system (#581).
  # Record results as 19.19.0.0.0 on arm64.
  #
  # Its own profile rather than oracle19c's: two EE instances do not fit side by
  # side in the maintainer's 7.7 GB Docker Desktop, so `--profile oracle19c` must
  # not start both. Same init wrapper, same C## prefix, own port and volume.
  #
  # `--profile oracle19c-ru down -v` removes this volume and leaves oracle-19c's:
  # compose scopes `-v` to the selected profile's services (checked 2026-09-28
  # with a scratch two-profile project). `--profile '*' down -v` takes both.
  oracle-19c-ru:
    # sha256:3843234f6fd1ed084b1dd7ad42eeeaa95ad13f12c790810cb368bb58f8ad42ba
    # (image created 2024-12-11; pulled before 2026-09-28)
    image: container-registry.oracle.com/database/enterprise:19.19.0.0
    platform: linux/arm64
    profiles: [oracle19c-ru]
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: sopuli-test
    ports: ["127.0.0.1:1527:1521", "[::1]:1527:1521"]
    volumes:
      - oracle19c-ru-data:/opt/oracle/oradata
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-19c:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 3600s

  # ----------------------------------------------------- oracle 12.2 (#572) ---
  # 12.2.0.1 Enterprise Edition, Oracle's own prebuilt "-slim" image, on the same
  # terms as oracle-19c: maintainer-only, never in CI, pulled after `docker login
  # container-registry.oracle.com` with the licence accepted. The only 12.x the
  # stack can start; 12.1 stays unmeasured.
  #
  # A much older image than the 19c ones (built 2017-08-17), and it differs in
  # every knob:
  #   - DB_SID / DB_PDB / DB_PASSWD, not ORACLE_SID / ORACLE_PDB / ORACLE_PWD;
  #   - no DBCA: first start untars prebuilt datafiles into /ORCL, so it is
  #     minutes rather than tens of minutes;
  #   - service names carry DB_DOMAIN, default `localdomain`, so the PDB is
  #     ORCLPDB1.localdomain and a bare ORCLPDB1 is ORA-12514;
  #   - NO user-script hook. oracle-init-12c/init.sh is run once, by hand, with
  #     the docker exec in docs/maintainer-environments.md: it writes a password file the
  #     image's own setup refused to (OPW-00029 -- `sopuli-test` has no digit),
  #     creates the USERS tablespace this image's root lacks, and applies the
  #     test profiles in the PDB;
  #   - a WE8DEC database, not AL32UTF8 -- the only non-Unicode one in the stack.
  #
  # The volume is /ORCL, the image's own: setupDB.sh finds the datafiles there
  # on a recreated container and starts the existing database instead of
  # untarring a new one. Record results as 12.2.0.1.0, never "12c".
  oracle-12c:
    # sha256:68dbe7251bddcc3d70827845bcdc8687eef66471e6e8ea37419eb73f61e4748b
    # (image created 2017-08-17; pulled 2026-09-29)
    image: container-registry.oracle.com/database/enterprise:12.2.0.1-slim
    profiles: [oracle12c]
    environment:
      DB_SID: ORCLCDB
      DB_PDB: ORCLPDB1
      DB_PASSWD: sopuli-test
      # The image sets ORACLE_HOME but not these two -- its scripts get them from
      # ~/.bashrc, which `docker exec` does not read. Without them the suite's
      # `docker exec <container> sqlplus` finds no sqlplus, and `/ as sysdba`
      # attaches to SID ORCL, which does not exist.
      ORACLE_SID: ORCLCDB
      PATH: /u01/app/oracle/product/12.2.0/dbhome_1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports: ["127.0.0.1:1528:1521", "[::1]:1528:1521"]
    volumes:
      - oracle12c-data:/ORCL
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-12c:/opt/sopuli/oracle-init-12c:ro
    healthcheck:
      # Three conditions, so that `healthy` means ready for the suite:
      #   - the image's own check, V$INSTANCE.STATUS = OPEN;
      #   - the PDB's service registered. The image starts the listener after
      #     the database, so the instance is OPEN about a minute before PMON's
      #     next registration and a client meanwhile gets ORA-12514 -- measured
      #     2026-09-29, "The listener supports no services" with the PDB READ WRITE;
      #   - oracle-init-12c/init.sh has completed, which it marks in the /ORCL
      #     volume as its last step. Until then this stays `starting`, and turns
      #     `unhealthy` once start_period is spent -- the signal to run it.
      test: ["CMD-SHELL", "test -f /ORCL/.sopuli-init-12c-done && /bin/bash /home/oracle/setup/healthcheck.sh && lsnrctl status | grep -qi 'Service \"orclpdb1'"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 1800s

  # ------------------------------------------------------------------ NNE ---
  # Approximates the OCI constraint locally: the server REQUIRES Native Network
  # Encryption, so a thin-mode connection fails with DPY-3001 and a thick-mode
  # one connects encrypted. Start it as README.md says: `--wait` on the whole
  # profile fails on the one-shot vault-init.
  oracle-nne:
    image: gvenzl/oracle-free:latest
    profiles: [nne]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1525:1521", "[::1]:1525:1521"]
    # Not a mount at dbconfig/FREE/sqlnet.ora: that creates dbconfig/FREE, and
    # the image then skips creating the database. The startup script in
    # oracle-init-nne/ adds the file to sqlnet.ora on each start instead.
    volumes:
      - ./oracle-init-nne:/container-entrypoint-startdb.d:ro
    healthcheck:
      # The image's own check, and the block the startup script adds. The image
      # runs that script after its own check can already pass, so without the
      # second condition `up --wait` can return before NNE is required.
      test: ["CMD-SHELL", "healthcheck.sh && grep -qx '# BEGIN sopuli oracle-init-nne' /opt/oracle/oradata/dbconfig/FREE/sqlnet.ora"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # ------------------------------------------------- emulators (smoke only) --
  # Never authoritative. A green run here is "the code path executes", nothing
  # more; the real services are the release evidence. There is no AWS emulator
  # here: LocalStack's image needs an account token (T3).
  lowkey-vault:
    # Pinned, as vault is: the image publishes version tags only, and has no
    # :latest.
    image: nagyesta/lowkey-vault:7.3.112
    profiles: [emulators]
    ports: ["127.0.0.1:8443:8443", "[::1]:8443:8443"]
    # The image declares no healthcheck, so without this `up --wait` returns
    # before the service answers. /ping on the HTTP port inside the container
    # answers `pong` once it is ready.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  # Only the two 19c services and 12.2 keep their datafiles; see oracle-19c for why.
  oracle19c-data:
  oracle19c-ru-data:
  oracle12c-data:
