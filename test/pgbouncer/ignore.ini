;; pgbouncer.ini beside it, with one change: `options` is in
;; ignore_startup_parameters, so a client that sends it is let in.
;; The service pgbouncer-ignore runs this file.

[databases]
session = host=postgres port=5432 dbname=sopuli pool_mode=session
transaction = host=postgres port=5432 dbname=sopuli pool_mode=transaction pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM public.pgbouncer_lookup($1)

max_client_conn = 100
default_pool_size = 20

ignore_startup_parameters = options
