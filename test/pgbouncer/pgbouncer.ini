;; PgBouncer in front of the compose `postgres` service, for
;; sql/postgres/08_pgbouncer_probe.py (#1045). Profile `pgbouncer` only.
;;
;; Two databases, one for each pool mode. Both reach the database `sopuli`, so
;; a client chooses the mode by the dbname it asks for.
;;
;; `transaction` has a pool of one server connection, so two clients of one
;; role always share it, and what one leaves set the other sees.

[databases]
session = host=postgres port=5432 dbname=sopuli pool_mode=session
transaction = host=postgres port=5432 dbname=sopuli pool_mode=transaction pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; A client logs in with SCRAM. PgBouncer reads the role's verifier from the
;; server with auth_query, as pgbouncer_auth, and logs in to the server with
;; the keys the client's SCRAM exchange gave it. The probe creates the role
;; and the function.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM public.pgbouncer_lookup($1)

max_client_conn = 100
default_pool_size = 20
